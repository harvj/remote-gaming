name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-24.04
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Run RuboCop
        run: bundle exec rubocop

  security:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run Brakeman
        run: bundle exec brakeman --no-pager

      - name: Run bundler-audit
        run: bundle exec bundler-audit --update

  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: remote_gaming_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d remote_gaming_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/remote_gaming_test

    steps:
      - name: Install PostgreSQL client libs
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Test Site Art presentation
        run: node --test spec/frontend/site_art_presentation_test.js

      - name: Build production assets
        run: RAILS_ENV=production SECRET_KEY_BASE_DUMMY=1 bundle exec rails assets:precompile

      - name: Prepare test database
        run: bundle exec rails db:schema:load

      - name: Run RSpec
        run: bundle exec rspec --format progress

      - name: Check isolated staging route boot
        env:
          RAILS_ENV: production
          REMOTE_GAMING_PRIVATE_STAGING: '1'
          REMOTE_GAMING_OIDC_ISSUER: https://auth.harvj.com
          REMOTE_GAMING_OIDC_CLIENT_ID: fixture
          REMOTE_GAMING_OIDC_CLIENT_SECRET: fixture
          REMOTE_GAMING_OIDC_REDIRECT_URI: https://modern-art.staging.radioactivita.com/auth/callback
          REMOTE_GAMING_OIDC_OWNER_SUBJECT: 11111111-2222-4333-8444-555555555555
          REMOTE_GAMING_OIDC_OWNER_EVIDENCE: RG-STAGING-AUTH-OWNER-1-1
        run: |
          export DATABASE_URL="postgresql://remote_gaming_staging:$(openssl rand -hex 32)@127.0.0.1/remote_gaming_staging"
          export SECRET_KEY_BASE="$(openssl rand -hex 64)"
          bundle exec rails routes | tee tmp/staging-routes
          grep -Eq 'GET +/login[^ ]* +auth#start' tmp/staging-routes
          ! grep -Eq 'POST +/login|/login[^ ]* +users/sessions#' tmp/staging-routes
          grep -Eq 'GET +/staging/directory[^ ]* +directory#staging_content' tmp/staging-routes

      - name: Probe production Rails and compiled assets
        shell: bash
        run: |
          export RAILS_ENV=production BIND_HOST=127.0.0.1 PORT=3012
          export SECRET_KEY_BASE=$(openssl rand -hex 64)
          bundle exec rails zeitwerk:check
          bundle exec puma -C config/puma.rb &
          puma_pid=$!
          trap 'kill "$puma_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS -H 'Host: radioactivita.com' http://127.0.0.1:3012/up > /dev/null 2>&1; then break; fi
            sleep 1
          done
          PUMA_URL=http://127.0.0.1:3012 deploy/smoke
